<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d19">
  <meta name="description"
    content="Portfolio of Mahadi Hassan Mithun — Software Engineer specializing in Flutter, Golang and SQL.">
  <title>Portfolio | Mahadi Hassan Mithun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #080d19;
      --surface: #101a2c;
      --surface-2: #17243a;
      --text: #f3f6ff;
      --muted: #a6b3ca;
      --line: rgba(180, 200, 235, .15);
      --accent: #65e6bd;
      --accent-2: #8ca7ff;
      --shadow: 0 24px 65px rgba(0, 0, 0, .22);
      --radius: 20px;
      --max: 1160px;
    }

    body.light {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #fff;
      --surface-2: #eef2f8;
      --text: #172033;
      --muted: #5f6b80;
      --line: rgba(32, 50, 80, .13);
      --accent: #087f68;
      --accent-2: #4c62cf;
      --shadow: 0 18px 45px rgba(31, 48, 78, .09);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 95px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      line-height: 1.65;
      transition: background .3s, color .3s;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(var(--max), calc(100% - 44px));
      margin-inline: auto;
    }

    /* Navigation */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font: 800 1.12rem Manrope, sans-serif;
      letter-spacing: -.04em;
      white-space: nowrap;
    }

    .brand span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
      margin-left: auto;
      color: var(--muted);
      font-size: .91rem;
    }

    .nav-links a {
      position: relative;
      padding: 8px 0;
      transition: color .25s;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      border-radius: 10px;
      background: var(--accent);
      transition: width .3s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--accent);
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn,
    .menu-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1.05rem;
      transition: transform .25s, border-color .25s;
    }

    .icon-btn:hover,
    .menu-btn:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .menu-btn {
      display: none;
    }

    /* Hero */
    .hero {
      padding: 105px 0 76px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      right: -150px;
      top: -250px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(120, 224, 193, .15), transparent 68%);
      pointer-events: none;
      animation: glowPulse 6s ease-in-out infinite;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 350px;
      height: 350px;
      left: -200px;
      bottom: -200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(140, 167, 255, .12), transparent 70%);
      pointer-events: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.35fr .65fr;
      align-items: center;
      gap: 60px;
    }

    .eyebrow {
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: .76rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--accent);
    }

    h1,
    h2,
    h3 {
      font-family: Manrope, sans-serif;
      line-height: 1.18;
      letter-spacing: -.04em;
    }

    h1 {
      font-size: clamp(2.65rem, 6vw, 5.25rem);
      margin: 18px 0 15px;
      max-width: 760px;
    }

    .gradient {
      background: linear-gradient(100deg, var(--accent), var(--accent-2), var(--accent));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientFlow 5s linear infinite;
    }

    .hero-title {
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      font-weight: 600;
    }

    .hero-summary {
      color: var(--muted);
      max-width: 690px;
      font-size: 1.02rem;
      margin: 22px 0 28px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 19px;
      border-radius: 13px;
      font-weight: 700;
      font-size: .92rem;
      border: 1px solid var(--line);
      transition: transform .25s, box-shadow .25s, background .25s;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(101, 230, 189, .15);
    }

    .btn-primary {
      background: var(--accent);
      color: #092018;
      border-color: var(--accent);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
    }

    .hero-photo-wrap {
      justify-self: end;
      position: relative;
      width: min(350px, 100%);
      animation: floatPhoto 6s ease-in-out infinite;
    }

    .hero-photo-wrap::before {
      content: "";
      position: absolute;
      inset: 18px -18px -18px 18px;
      border: 1px solid var(--accent);
      border-radius: 30px;
      opacity: .55;
      animation: borderPulse 4s ease-in-out infinite;
    }

    .hero-photo {
      position: relative;
      width: 100%;
      aspect-ratio: 4/5;
      object-fit: cover;
      border-radius: 28px;
      background: var(--surface-2);
      box-shadow: var(--shadow);
    }

    .photo-caption {
      position: absolute;
      bottom: -32px;
      left: -42px;
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 15px;
      box-shadow: var(--shadow);
      font-size: .82rem;
      color: var(--muted);
      animation: fadeUp .8s .5s both;
    }

    .photo-caption strong {
      display: block;
      color: var(--text);
      font-size: .96rem;
    }

    /* Sections */
    section {
      padding: 76px 0;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 30px;
    }

    .section-kicker {
      color: var(--accent);
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .2em;
      font-weight: 700;
    }

    h2 {
      font-size: clamp(1.9rem, 4vw, 2.8rem);
      margin: 7px 0 0;
    }

    .section-note {
      color: var(--muted);
      max-width: 430px;
      margin: 0;
      font-size: .93rem;
    }

    /* About */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 27px;
      box-shadow: var(--shadow);
      transition: transform .3s, border-color .3s;
    }

    .panel:hover {
      border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
    }

    .about-copy {
      color: var(--muted);
      margin: 0;
      font-size: 1.02rem;
    }

    .contact-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
      margin-top: 24px;
    }

    .contact-item small {
      display: block;
      color: var(--muted);
      font-size: .75rem;
      margin-bottom: 3px;
    }

    .contact-item a,
    .contact-item span {
      font-weight: 600;
      font-size: .91rem;
      overflow-wrap: anywhere;
    }

    /* Experience */
    .timeline {
      display: grid;
      gap: 16px;
    }

    .timeline-item {
      display: block;
      padding: 25px 0;
      border-bottom: 1px solid var(--line);
    }

    .timeline-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 10px;
    }

    .timeline-heading {
      min-width: 0;
    }

    .timeline-item .date {
      flex: 0 0 auto;
      text-align: right;
      white-space: nowrap;
      padding-top: 2px;
    }

    .timeline-item:last-child {
      border-bottom: 0;
    }

    .date {
      color: var(--accent);
      font-size: .84rem;
      font-weight: 700;
    }

    .timeline-item h3 {
      margin: 0 0 4px;
      font-size: 1.18rem;
      letter-spacing: -.02em;
    }

    .subline {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 10px;
    }

    .timeline-item p {
      color: var(--muted);
      margin: 0;
      font-size: .94rem;
    }

    /* Projects */
    .project-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 22px;
    }

    .project-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 38%);
      grid-template-areas: "body cover";
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      transition: transform .3s, border-color .3s, box-shadow .3s;
    }

    .project-card.no-image {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "body";
    }

    .project-card:hover {
      transform: translateY(-7px);
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      box-shadow: 0 18px 40px rgba(0, 0, 0, .18);
    }

    .project-cover {
      grid-area: cover;
      position: relative;
      min-height: 0;
      background: var(--surface-2);
      overflow: hidden;
    }

    .project-cover img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .6s cubic-bezier(.2, .7, .2, 1);
    }

    .project-card:hover .project-cover img {
      transform: scale(1.07);
    }

    .project-cover .count {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: rgba(5, 10, 20, .75);
      color: white;
      border: 1px solid rgba(255, 255, 255, .2);
      padding: 5px 9px;
      border-radius: 99px;
      font-size: .74rem;
    }

    .project-body {
      grid-area: body;
      padding: 21px;
    }

    .project-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .project-top h3 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: -.025em;
    }

    .tag {
      flex: none;
      background: color-mix(in srgb, var(--accent) 13%, var(--surface));
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line));
      padding: 4px 9px;
      border-radius: 99px;
      font-size: .72rem;
      font-weight: 700;
    }

    .project-body p {
      color: var(--muted);
      font-size: .9rem;
      margin: 12px 0 17px;
      white-space: pre-line;
    }

    .project-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .text-link {
      color: var(--accent);
      font-weight: 700;
      font-size: .86rem;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    /* Skills */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .skill-group h3 {
      font-size: 1rem;
      margin: 0 0 15px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 7px 11px;
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: .82rem;
      border: 1px solid var(--line);
      transition: color .2s, border-color .2s, transform .2s;
    }

    .chip:hover {
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-3px);
    }

    /* Achievements */
    .simple-list {
      display: grid;
      gap: 17px;
    }

    .simple-item {
      padding-bottom: 15px;
      border-bottom: 1px solid var(--line);
    }

    .simple-item:last-child {
      padding: 0;
      border: 0;
    }

    .achievement-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
    }

    .achievement-info {
      flex: 1;
      min-width: 0;
    }

    .achievement-info strong {
      display: block;
      font-size: .97rem;
    }

    .achievement-info span {
      display: block;
      color: var(--muted);
      font-size: .85rem;
    }

    .achievement-item .result {
      color: var(--accent);
      font-weight: 700;
      font-size: .9rem;
      text-align: right;
      flex-shrink: 0;
      margin-top: 0;
    }

    /* Contact */
    .contact-cta {
      padding-top: 36px;
    }

    .contact-cta-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
      padding: clamp(28px, 5vw, 54px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(120deg, var(--surface), var(--surface-2));
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .contact-cta-inner::before {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      right: -100px;
      top: -140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(101, 230, 189, .14), transparent 70%);
      pointer-events: none;
    }

    .contact-cta h2 {
      margin: 10px 0 12px;
      font-size: clamp(2rem, 4vw, 3.3rem);
    }

    .contact-cta p {
      color: var(--muted);
      margin: 0;
    }

    .contact-cta-actions {
      display: grid;
      gap: 12px;
      min-width: min(100%, 290px);
    }

    /* Footer */
    .footer {
      border-top: 1px solid var(--line);
      padding: 30px 0;
      color: var(--muted);
      font-size: .85rem;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .socials {
      display: flex;
      gap: 16px;
    }

    .socials a:hover {
      color: var(--accent);
    }

    /* Gallery */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 15, .86);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: min(900px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      position: relative;
      animation: modalIn .3s ease both;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 1.2rem;
    }

    .modal-image {
      width: 100%;
      max-height: 68vh;
      object-fit: contain;
      border-radius: 12px;
      background: var(--surface-2);
    }

    .modal-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 13px;
      color: var(--muted);
      font-size: .85rem;
    }

    .modal-controls button {
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 10px;
      cursor: pointer;
    }

    .modal-controls button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .loading,
    .error {
      padding: 70px 20px;
      text-align: center;
      color: var(--muted);
    }

    .error strong {
      display: block;
      color: var(--text);
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .error code {
      color: var(--accent);
    }

    /* General animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(28px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes floatPhoto {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes glowPulse {

      0%,
      100% {
        opacity: .6;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.12);
      }
    }

    @keyframes borderPulse {

      0%,
      100% {
        opacity: .35;
      }

      50% {
        opacity: .8;
      }
    }

    @keyframes gradientFlow {
      to {
        background-position: 200% center;
      }
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .hero-grid>div:first-child {
      animation: fadeUp .8s ease both;
    }

    .hero-photo-wrap {
      animation: fadeUp .9s .15s ease both, floatPhoto 6s 1s ease-in-out infinite;
    }

    .reveal {
      opacity: 0;
      transform: translateY(25px);
      transition: opacity .7s ease, transform .7s ease;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .project-card.reveal:nth-child(2n),
    .skill-group.reveal:nth-child(2n) {
      transition-delay: .1s;
    }

    .project-card.reveal:nth-child(3n) {
      transition-delay: .18s;
    }

    /* Custom mouse cursor */
    @media (hover: hover) and (pointer: fine) {

      body,
      body a,
      body button {
        cursor: none;
      }

      .cursor-dot,
      .cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
        will-change: left, top;
      }

      .cursor-dot {
        width: 7px;
        height: 7px;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent);
        transition: transform .2s ease, opacity .2s ease;
      }

      .cursor-ring {
        width: 36px;
        height: 36px;
        border: 1px solid var(--accent);
        background: rgba(101, 230, 189, .06);
        transition:
          width .25s ease,
          height .25s ease,
          background .25s ease,
          border-color .25s ease,
          opacity .2s ease;
      }

      .cursor-ring.hover {
        width: 55px;
        height: 55px;
        background: rgba(101, 230, 189, .13);
        border-color: var(--accent-2);
      }

      .cursor-dot.hover {
        transform: translate(-50%, -50%) scale(1.6);
      }

      .cursor-ring.clicking {
        width: 25px;
        height: 25px;
      }
    }

    /* Responsive */
    @media(max-width: 850px) {
      .nav-links {
        display: none;
        position: absolute;
        top: 76px;
        left: 0;
        right: 0;
        padding: 18px 22px 22px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .nav-links.show {
        display: flex;
      }

      .menu-btn {
        display: grid;
      }

      .hero-grid {
        grid-template-columns: 1fr .62fr;
        gap: 30px;
      }

      .timeline-item {
        grid-template-columns: 145px 1fr;
        gap: 18px;
      }
    }

    @media(max-width: 620px) {
      .container {
        width: min(100% - 32px, var(--max));
      }

      .nav {
        height: 68px;
      }

      .nav-links {
        top: 68px;
      }

      .hero {
        padding: 60px 0 48px;
      }

      .hero-grid {
        grid-template-columns: 1fr;
      }

      .hero-photo-wrap {
        justify-self: center;
        width: min(245px, 72%);
        margin: 12px 0 10px;
      }

      .photo-caption {
        left: -20px;
      }

      section {
        padding: 55px 0;
      }

      .section-head {
        display: block;
      }

      .section-note {
        margin-top: 12px;
      }

      .timeline-item {
        grid-template-columns: 1fr;
        gap: 5px;
        padding: 20px 0;
      }

      .project-grid,
      .skills-grid {
        grid-template-columns: 1fr;
      }

      .project-card {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "cover"
          "body";
      }

      .project-card.no-image {
        grid-template-areas: "body";
      }

      .project-cover {
        aspect-ratio: 16/10;
        min-height: 0;
      }

      .panel {
        padding: 21px;
      }

      .contact-list {
        grid-template-columns: 1fr;
      }

      .contact-cta-inner {
        align-items: stretch;
        flex-direction: column;
      }

      .achievement-item {
        align-items: flex-start;
        gap: 12px;
      }

      .achievement-item .result {
        max-width: 40%;
        overflow-wrap: anywhere;
      }
    }

    @media(prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

      .reveal {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="loading">Loading portfolio…</div>
  </div>

  <div class="modal" id="galleryModal" aria-modal="true" role="dialog" aria-label="Project image gallery">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">Project gallery</h3>
        <button class="icon-btn" id="closeModal" aria-label="Close gallery">✕</button>
      </div>
      <img class="modal-image" id="modalImage" alt="Project screenshot">
      <div class="modal-controls">
        <button id="prevImage">← Previous</button>
        <span id="imageCounter"></span>
        <button id="nextImage">Next →</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const $ = (s, root = document) => root.querySelector(s);

      const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));

      const dateFmt = value => {
        if (!value) return "Present";

        const d = new Date(value + (value.length === 10 ? "T00:00:00" : ""));

        return Number.isNaN(d.getTime())
          ? value
          : d.toLocaleDateString("en-US", {
            month: "short",
            year: "numeric"
          });
      };

      const period = (a, b) => `${dateFmt(a)} – ${dateFmt(b)}`;

      const link = (url, label) => url
        ? `<a class="text-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`
        : "";

      let gallery = [];
      let galleryIndex = 0;

      function render(data) {
        const p = data.personal_information || {};
        const projects = data.projects || [];
        const exp = data.work_experience || [];
        const skills = data.skills || {};

        const projectCards = projects.map((item, i) => {
          const images = (item.images || []).filter(Boolean);

          return `
            <article class="project-card${images.length ? "" : " no-image"}">
              ${images.length ? `
              <div class="project-cover"
                data-gallery="${i}"
                role="button"
                tabindex="0"
                aria-label="View ${esc(item.name)} screenshots">

                  <img src="${esc(images[0])}"
                    alt="${esc(item.name)} screenshot"
                    loading="lazy"
                    onerror="this.style.display='none'">

                ${images.length > 1
                ? `<span class="count">${images.length} images · View gallery</span>`
                : ""}
              </div>
              ` : ""}

              <div class="project-body">
                <div class="project-top">
                  <h3>${esc(item.name)}</h3>
                  <span class="date">${period(item.start, item.end)}</span>
                </div>

                <p>${esc(item.description || "")}</p>

                <div class="project-footer">
                  <span class="tag">${esc(item.role || "Project")}</span>
                  ${link(item.url, "Explore project")}
                </div>
              </div>
            </article>
          `;
        }).join("");

        const skillCards = Object.entries(skills).map(([name, items]) => `
          <div class="panel skill-group">
            <h3>${esc(name.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase()))}</h3>
            <div class="chips">
              ${(items || []).map(x => `<span class="chip">${esc(x)}</span>`).join("")}
            </div>
          </div>
        `).join("");

        const experience = exp.map(item => `
          <article class="timeline-item">
            <div class="timeline-header">
              <div class="timeline-heading">
                <h3>${esc(item.company)}</h3>
                <div class="subline">${esc(item.title)}</div>
              </div>
              <div class="date">${period(item.start, item.end)}</div>
            </div>
            <p>${esc(item.description)}</p>
          </article>
        `).join("");

        const achievements = (data.achievements || []).map(item => `
          <div class="simple-item achievement-item">
            <div class="achievement-info">
              <strong>${esc(item.name)}</strong>
              <span>${esc(item.associated)}</span>
            </div>
            <span class="result">${esc(item.result)}</span>
          </div>
        `).join("");

        $('#app').innerHTML = `
          <header class="topbar">
            <div class="container nav">
              <a class="brand" href="#home">
                ${esc(p.full_name || "Portfolio")}<span>.</span>
              </a>

              <nav class="nav-links" id="navLinks">
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#experience">Experience</a>
                <a href="#skills">Skills</a>
                <a href="#highlights">Achievements</a>
                <a href="#contact">Contact</a>
              </nav>

              <div class="nav-actions">
                <button class="icon-btn" id="themeToggle" aria-label="Toggle color theme">☼</button>
                <button class="menu-btn" id="menuToggle" aria-label="Toggle navigation">☰</button>
              </div>
            </div>
          </header>

          <main>
            <section class="hero" id="home">
              <div class="container hero-grid">
                <div>
                  <div class="eyebrow">Available for opportunities</div>

                  <h1>
                    Building useful<br>
                    <span class="gradient">digital experiences.</span>
                  </h1>

                  <div class="hero-title">
                    ${esc(p.professional_title || "Software Engineer")}
                  </div>

                  <p class="hero-summary">${esc(data.about || "")}</p>

                  <div class="actions">
                    ${p.email ? `
                      <a class="btn btn-primary" href="mailto:${esc(p.email)}">
                        Get in touch
                      </a>
                    ` : ""}

                    ${p.github ? `
                      <a class="btn btn-secondary" href="${esc(p.github)}"
                        target="_blank" rel="noopener noreferrer">GitHub ↗</a>
                    ` : ""}

                    ${p.linkedin ? `
                      <a class="btn btn-secondary" href="${esc(p.linkedin)}"
                        target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
                    ` : ""}

                    
                  </div>
                </div>

                <div class="hero-photo-wrap">
                  ${p.photo ? `
                    <img class="hero-photo" src="${esc(p.photo)}"
                      alt="${esc(p.full_name)}"
                      onerror="this.style.visibility='hidden'">
                  ` : ""}

                  <div class="photo-caption">
                    <strong>${esc(p.full_name)}</strong>
                  </div>
                </div>
              </div>
            </section>

            <section id="about">
              <div class="container">
                <div class="section-head">
                  <div>
                    <div class="section-kicker">A little about me</div>
                    <h2>About</h2>
                  </div>
                </div>

                <div class="about-grid">
                  <div class="panel">
                    <p class="about-copy">${esc(data.summary || "")}</p>

                    <div class="contact-list">
                      ${p.email ? `
                        <div class="contact-item">
                          <small>Email</small>
                          <a href="mailto:${esc(p.email)}">${esc(p.email)}</a>
                        </div>
                      ` : ""}

                      ${p.phone ? `
                        <div class="contact-item">
                          <small>Phone</small>
                          <a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>
                        </div>
                      ` : ""}

                      ${p.location ? `
                        <div class="contact-item">
                          <small>Location</small>
                          <span>${esc(p.location)}</span>
                        </div>
                      ` : ""}

                    </div>
                  </div>
                </div>
              </div>
            </section>

            <section id="projects">
              <div class="container">
                <div class="section-head">
                  <div>
                    <div class="section-kicker">Selected work</div>
                    <h2>Featured projects</h2>
                  </div>
                  <p class="section-note">
                    A selection of mobile, backend, open-source and full-stack work.
                    Select a project image to browse its screenshots.
                  </p>
                </div>

                <div class="project-grid">
                  ${projectCards || "<p>No projects added yet.</p>"}
                </div>
              </div>
            </section>

            <section id="experience">
              <div class="container">
                <div class="section-head">
                  <div>
                    <div class="section-kicker">Where I've worked</div>
                    <h2>Experience</h2>
                  </div>
                  <p class="section-note">
                    Professional roles and the teams I've contributed to.
                  </p>
                </div>

                <div class="panel">
                  <div class="timeline">
                    ${experience || "<p>No experience added yet.</p>"}
                  </div>
                </div>
              </div>
            </section>

            <section id="skills">
              <div class="container">
                <div class="section-head">
                  <div>
                    <div class="section-kicker">My toolkit</div>
                    <h2>Skills & technologies</h2>
                  </div>
                  <p class="section-note">
                    Technologies and problem-solving areas I work with.
                  </p>
                </div>

                <div class="skills-grid">${skillCards}</div>
              </div>
            </section>

            <section id="highlights">
              <div class="container">
                <div class="section-head">
                  <div>
                    <div class="section-kicker">Milestones</div>
                    <h2>Achievements</h2>
                  </div>
                  <p class="section-note">
                    A few milestones and accomplishments.
                  </p>
                </div>

                <div class="panel">
                  <div class="simple-list">
                    ${achievements || "<p>No achievements added yet.</p>"}
                  </div>
                </div>
              </div>
            </section>

            <section id="contact" class="contact-cta">
              <div class="container">
                <div class="contact-cta-inner">
                  <div>
                    <div class="section-kicker">Have a project in mind?</div>
                    <h2>
                      Let's build something<br>
                      <span class="gradient">great together.</span>
                    </h2>
                    <p>Have an idea or an opportunity? I'd love to hear from you.</p>
                  </div>

                  <div class="contact-cta-actions">
                    ${p.email ? `
                      <a class="btn btn-primary" href="mailto:${esc(p.email)}">
                        ${esc(p.email)}
                      </a>
                    ` : ""}

                    ${p.phone ? `
                      <a class="btn btn-secondary" href="tel:${esc(p.phone)}">
                        ${esc(p.phone)}
                      </a>
                    ` : ""}
                  </div>
                </div>
              </div>
            </section>
          </main>

          <footer class="footer">
            <div class="container footer-inner">
              <span>
                © ${new Date().getFullYear()} ${esc(p.full_name || "Portfolio")}.
                Built with care.
              </span>

              <div class="socials">
                ${p.github ? `
                  <a href="${esc(p.github)}" target="_blank" rel="noopener">GitHub ↗</a>
                ` : ""}

                ${p.linkedin ? `
                  <a href="${esc(p.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>
                ` : ""}
<!--
                ${p.email ? `
                  <a href="mailto:${esc(p.email)}">Email ↗</a>
                ` : ""}
-->
              </div>
            </div>
          </footer>
        `;

        // Theme toggle
        $('#themeToggle').addEventListener('click', () => {
          document.body.classList.toggle('light');
          $('#themeToggle').textContent =
            document.body.classList.contains('light') ? '☾' : '☼';
        });

        // Mobile navigation
        $('#menuToggle').addEventListener('click', () => {
          $('#navLinks').classList.toggle('show');
        });

        $('#navLinks').querySelectorAll('a').forEach(a => {
          a.addEventListener('click', () => {
            $('#navLinks').classList.remove('show');
          });
        });

        // Reveal animation
        const revealTargets = document.querySelectorAll(
          'main section, .project-card, .skill-group, #highlights .panel, .contact-cta-inner'
        );

        revealTargets.forEach(el => el.classList.add('reveal'));

        if ('IntersectionObserver' in window) {
          const revealObserver = new IntersectionObserver(entries => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                revealObserver.unobserve(entry.target);
              }
            });
          }, { threshold: 0.08 });

          revealTargets.forEach(el => revealObserver.observe(el));
        } else {
          revealTargets.forEach(el => el.classList.add('is-visible'));
        }

        // Active navigation highlighting
        const navLinks = document.querySelectorAll('#navLinks a');
        const sections = document.querySelectorAll('main section[id]');

        if ('IntersectionObserver' in window) {
          const sectionObserver = new IntersectionObserver(entries => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                navLinks.forEach(link => {
                  link.classList.toggle(
                    'active',
                    link.getAttribute('href') === `#${entry.target.id}`
                  );
                });
              }
            });
          }, {
            rootMargin: '-25% 0px -60% 0px',
            threshold: 0
          });

          sections.forEach(section => sectionObserver.observe(section));
        }

        // Project gallery
        projects.forEach((project, index) => {
          const cover = document.querySelector(`[data-gallery="${index}"]`);

          if (!cover || !(project.images || []).length) return;

          const open = () => openGallery(project.name, project.images);

          cover.addEventListener('click', open);

          cover.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              open();
            }
          });
        });
      }

      // Gallery functions
      function openGallery(title, images) {
        gallery = images || [];
        galleryIndex = 0;
        $('#modalTitle').textContent = title;
        showImage();
        $('#galleryModal').classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function showImage() {
        if (!gallery.length) return;

        $('#modalImage').src = gallery[galleryIndex];
        $('#imageCounter').textContent = `${galleryIndex + 1} / ${gallery.length}`;
        $('#prevImage').disabled = gallery.length < 2;
        $('#nextImage').disabled = gallery.length < 2;
      }

      function closeGallery() {
        $('#galleryModal').classList.remove('open');
        document.body.style.overflow = '';
      }

      $('#closeModal').addEventListener('click', closeGallery);

      $('#galleryModal').addEventListener('click', e => {
        if (e.target.id === 'galleryModal') closeGallery();
      });

      $('#prevImage').addEventListener('click', () => {
        galleryIndex = (galleryIndex - 1 + gallery.length) % gallery.length;
        showImage();
      });

      $('#nextImage').addEventListener('click', () => {
        galleryIndex = (galleryIndex + 1) % gallery.length;
        showImage();
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeGallery();

        if ($('#galleryModal').classList.contains('open') && e.key === 'ArrowRight') {
          $('#nextImage').click();
        }

        if ($('#galleryModal').classList.contains('open') && e.key === 'ArrowLeft') {
          $('#prevImage').click();
        }
      });

      // Custom mouse cursor animation
      if (
        window.matchMedia('(hover: hover) and (pointer: fine)').matches &&
        !window.matchMedia('(prefers-reduced-motion: reduce)').matches
      ) {
        const dot = document.createElement('div');
        const ring = document.createElement('div');

        dot.className = 'cursor-dot';
        ring.className = 'cursor-ring';

        document.body.appendChild(ring);
        document.body.appendChild(dot);

        let mouseX = -100;
        let mouseY = -100;
        let ringX = -100;
        let ringY = -100;

        document.addEventListener('mousemove', e => {
          mouseX = e.clientX;
          mouseY = e.clientY;

          dot.style.left = mouseX + 'px';
          dot.style.top = mouseY + 'px';
        });

        function animateCursor() {
          ringX += (mouseX - ringX) * 0.16;
          ringY += (mouseY - ringY) * 0.16;

          ring.style.left = ringX + 'px';
          ring.style.top = ringY + 'px';

          requestAnimationFrame(animateCursor);
        }

        animateCursor();

        document.addEventListener('mouseover', e => {
          const interactive = e.target.closest(
            'a, button, .project-card, .chip, .project-cover'
          );

          ring.classList.toggle('hover', !!interactive);
          dot.classList.toggle('hover', !!interactive);
        });

        document.addEventListener('mousedown', () => {
          ring.classList.add('clicking');
        });

        document.addEventListener('mouseup', () => {
          ring.classList.remove('clicking');
        });

        document.addEventListener('mouseleave', () => {
          dot.style.opacity = '0';
          ring.style.opacity = '0';
        });

        document.addEventListener('mouseenter', () => {
          dot.style.opacity = '1';
          ring.style.opacity = '1';
        });
      }

      // Load portfolio data
      fetch('./data.json')
        .then(response => {
          if (!response.ok) {
            throw new Error(`Could not load data.json (${response.status})`);
          }

          return response.json();
        })
        .then(render)
        .catch(error => {
          $('#app').innerHTML = `
            <div class="container error">
              <strong>Portfolio data couldn't be loaded.</strong>
              ${esc(error.message)}
              <p>
                Make sure <code>portfolio.html</code> and <code>data.json</code>
                are in the same folder, then open the site through a local web server.
              </p>
              <p>
                For example, run <code>python3 -m http.server 8000</code>
                in that folder and visit
                <code>http://localhost:8000/portfolio.html</code>.
              </p>
            </div>
          `;
        });
    })();
  </script>
</body>

</html>
