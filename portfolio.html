<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131d">
  <title>Portfolio | Mahadi Hassan Mithun</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f2f4f8;
      background: #10131d;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #a4adbd;
      --accent: #76e1c2;
      --panel: #191e2a;
      --line: #ffffff19;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: var(--accent);
    }

    .wrap {
      width: min(1120px, calc(100% - 44px));
      margin: auto;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 0;
      border-bottom: 1px solid var(--line);
      background: rgba(16, 19, 29, 0.9);
      backdrop-filter: blur(10px);
    }

    .brand {
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      color: var(--muted);
      font-size: .9rem;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.4fr .6fr;
      gap: 50px;
      align-items: center;
      min-height: 0;
      padding: 30px 0;
    }

    .eyebrow {
      color: var(--accent);
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 720px;
      margin: 15px 0;
      font-size: clamp(2.7rem, 7vw, 5rem);
      line-height: .99;
      letter-spacing: -.065em;
    }

    .hero-title {
      margin: 20px 0 0;
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: 650;
    }

    .summary {
      max-width: 700px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.75;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 27px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 650;
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #111820;
    }

    .hero-photo {
      width: min(250px, 100%);
      aspect-ratio: 1;
      border: 1px solid #76e1c244;
      border-radius: 30px;
      object-fit: cover;
      background: var(--panel);
      transform: rotate(3deg);
    }

    .hero-profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .hero-profile .eyebrow {
      text-align: center;
    }

    .profile-location {
      display: grid;
      gap: 4px;
      text-align: center;
    }

    .profile-location span:last-child {
      color: var(--muted);
      font-size: .72rem;
      letter-spacing: .04em;
    }

    section {
      padding: 48px 0;
      border-top: 1px solid var(--line);
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 23px;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 2.25rem);
      letter-spacing: -.045em;
    }

    .section-note {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .project-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card {
      padding: 23px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
    }

    .project-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin: 18px 0 0;
    }

    .project-gallery img {
      width: 100%;
      height: 145px;
      border-radius: 7px;
      background: #10131d;
      object-fit: contain;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: baseline;
    }

    .card h3 {
      margin: 0;
      font-size: 1.12rem;
    }

    .meta {
      color: var(--accent);
      font-size: .78rem;
      font-weight: 650;
    }

    .card p {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.7;
    }

    .experience-list {
      display: grid;
      gap: 14px;
    }

    .experience-card {
      display: grid;
      grid-template-columns: 210px 1fr;
      gap: 25px;
    }

    .experience-card h3 {
      margin: 0;
      font-size: 1.08rem;
    }

    .experience-card .role {
      margin-top: 6px;
      color: var(--accent);
      font-size: .9rem;
    }

    .experience-card p {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.7;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .skill-group h3 {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: .95rem;
      text-transform: capitalize;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: #d3d8e1;
      font-size: .83rem;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .detail-list {
      display: grid;
      gap: 14px;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
    }

    .achievement-main {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
    }

    .achievement-main h3 {
      margin: 0;
      font-size: .98rem;
    }

    .achievement-main span {
      margin-top: 4px;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.6;
    }

    .achievement-result {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      flex-shrink: 0;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.6;
    }

    .achievement-result strong {
      color: var(--accent);
      font-weight: 700;
    }

    .education-main {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
    }

    .education-main h3 {
      margin: 0;
      font-size: .98rem;
    }

    .education-main span {
      margin-top: 4px;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.6;
    }

    .education-date {
      flex-shrink: 0;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.6;
      text-align: right;
      white-space: nowrap;
      margin-top: 2px;
    }

    .contact-panel {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: center;
      padding: 28px;
      border: 1px solid #76e1c244;
      border-radius: 14px;
      background: linear-gradient(120deg, #1d2930, #191e2a);
    }

    .contact-panel p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    footer {
      padding: 25px 0 36px;
      color: var(--muted);
      font-size: .82rem;
    }

    .notice {
      width: min(700px, calc(100% - 40px));
      margin: 40px auto;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      line-height: 1.6;
    }

    .notice[hidden],
    #site[hidden] {
      display: none;
    }

    @media (max-width: 700px) {
      .wrap {
        width: min(100% - 32px, 1120px);
      }

      .nav-links {
        gap: 13px;
        font-size: .8rem;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 30px;
        padding: 48px 0;
      }

      .hero-photo {
        width: 130px;
        border-radius: 20px;
      }

      .hero-profile {
        grid-row: 1;
        justify-self: start;
        align-items: flex-start;
      }

      .hero-profile .eyebrow {
        text-align: left;
      }

      .profile-location {
        text-align: left;
      }

      .project-grid,
      .two-column {
        grid-template-columns: 1fr;
      }

      .experience-card {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .skills-grid {
        grid-template-columns: 1fr;
      }

      .project-gallery {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }

      .contact-panel {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 420px) {
      .nav-links {
        gap: 9px;
        font-size: .73rem;
      }

      .skills-grid {
        grid-template-columns: 1fr;
      }

      .card-top {
        align-items: flex-start;
        flex-direction: column;
        gap: 7px;
      }
    }
  </style>
</head>

<body>
  <div id="notice" class="notice" role="status" hidden></div>
  <div id="site" hidden>
    <div class="wrap">
      <nav aria-label="Main navigation">
        <a class="brand" href="#home" id="brand"></a>
        <div class="nav-links">
          <a href="#projects">Projects</a><a href="#experience">Experience</a>
          <a href="#skills">Skills</a><a href="#contact">Contact</a>
        </div>
      </nav>
      <header class="hero" id="home">
        <div>
          <h1 id="name"></h1>
          <p class="hero-title" id="title"></p>
          <p class="summary" id="summary"></p>
          <div class="hero-actions" id="hero-actions"></div>
        </div>
        <div class="hero-profile">
          <img id="photo" class="hero-photo" alt="">
          <div class="eyebrow profile-location">
            <span id="location"></span>
          </div>
        </div>
      </header>
      <main>
        <section id="projects">
          <div class="section-heading">
            <h2>Selected projects</h2>
            <p class="section-note">A few things I’ve helped build.</p>
          </div>
          <div id="project-grid" class="project-grid"></div>
        </section>
        <section id="experience">
          <div class="section-heading">
            <h2>Experience</h2>
            <p class="section-note">Building useful software with thoughtful teams.</p>
          </div>
          <div id="experience-list" class="experience-list"></div>
        </section>
        <section id="skills">
          <div class="section-heading">
            <h2>Skills & tools</h2>
          </div>
          <div id="skills-grid" class="skills-grid"></div>
        </section>
        <section class="two-column">
          <div>
            <div class="section-heading">
              <h2>Highlights</h2>
            </div>
            <div id="achievement-list" class="detail-list"></div>
          </div>
        </section>
        <section id="contact">
          <div class="contact-panel">
            <div>
              <h2>Let’s build something great.</h2>
            </div>
            <div class="hero-actions" id="contact-actions" style="margin: 0"></div>
          </div>
        </section>
      </main>
      <footer id="footer"></footer>
    </div>
  </div>
  <script>
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
    const safeUrl = (value, schemes = ["http:", "https:"]) => {
      try {
        const parsed = new URL(value);
        return schemes.includes(parsed.protocol) ? escapeHtml(parsed.href) : "#";
      } catch {
        return "#";
      }
    };
    const imageSrc = (value) => {
      try {
        const parsed = new URL(value, document.baseURI);
        return parsed.origin === window.location.origin ? escapeHtml(parsed.href) : "";
      } catch {
        return "";
      }
    };
    const formatDate = (value) => {
      if (value == null || value === "") return "";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? String(value) : new Intl.DateTimeFormat("en", {
        month: "short", year: "numeric", timeZone: "UTC"
      }).format(date);
    };
    const formatPeriod = (item) => {
      if (item.start == null && item.end == null) return item.period ?? "";
      return [formatDate(item.start), item.end == null ? "Now" : formatDate(item.end)]
        .filter(Boolean).join(" – ");
    };
    const externalLink = (label, url, primary = false) =>
      `<a class="button${primary ? " primary" : ""}" href="${safeUrl(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`;
    const contactLink = (label, url, primary = false) =>
      `<a class="button${primary ? " primary" : ""}" href="${safeUrl(url, ["mailto:", "tel:"])}">${escapeHtml(label)}</a>`;
    const notice = document.querySelector("#notice");
    const site = document.querySelector("#site");

    fetch("./data.json")
      .then((response) => {
        if (!response.ok) throw new Error(`Could not load data.json (${response.status})`);
        return response.json();
      })
      .then((data) => {
        const person = data.personal_information;
        document.title = `Portfolio | ${person.full_name}`;
        document.querySelector("#brand").textContent = person.full_name;
        document.querySelector("#name").textContent = person.full_name;
        document.querySelector("#title").textContent = person.professional_title;
        document.querySelector("#summary").textContent = data.summary;
        document.querySelector("#location").textContent = person.location;
        document.querySelector("#footer").textContent = `© ${new Date().getFullYear()} ${person.full_name}`;
        const photo = document.querySelector("#photo");
        const profilePhoto = person.photo && imageSrc(person.photo);
        if (profilePhoto) {
          photo.src = profilePhoto;
          photo.alt = `Portrait of ${person.full_name}`;
        } else {
          photo.hidden = true;
        }

        const social = [
          person.github && externalLink("GitHub", person.github),
          person.linkedin && externalLink("LinkedIn", person.linkedin)
        ].filter(Boolean);
        const emailAction = person.email
          ? contactLink("Get in touch", `mailto:${encodeURIComponent(person.email)}`, true)
          : "";
        document.querySelector("#hero-actions").innerHTML = [emailAction, ...social].join("");
        document.querySelector("#contact-actions").innerHTML = [
          person.email && contactLink(person.email, `mailto:${encodeURIComponent(person.email)}`, true),
          person.phone && contactLink(person.phone, `tel:${person.phone.replace(/[^\d+]/g, "")}`)
        ].filter(Boolean).join("");

        document.querySelector("#project-grid").innerHTML = data.projects.map((project) => {
          const images = (project.images || []).map((image) => imageSrc(image)).filter(Boolean);
          const projectTitle = project.url ? `<a href="${safeUrl(project.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(project.name)}</a>` : escapeHtml(project.name);
          return `
            <article class="card">
              <div class="card-top"><h3>${projectTitle}</h3><span class="meta">${escapeHtml(project.role)} · ${escapeHtml(formatPeriod(project))}</span></div>
              <p>${escapeHtml(project.description)}</p>
              ${images.length ? `<div class="project-gallery">${images.map((image, index) =>
            `<img src="${image}" alt="${escapeHtml(project.name)} project image ${index + 1}" loading="lazy">`
          ).join("")}</div>` : ""}
            </article>`;
        }).join("");
        document.querySelector("#experience-list").innerHTML = data.work_experience.map((job) => `
          <article class="card experience-card">
            <div><h3>${escapeHtml(job.company)}</h3><div class="role">${escapeHtml(job.title)}</div><div class="section-note">${escapeHtml(formatPeriod(job))}</div></div>
            <p>${escapeHtml(job.description)}</p>
          </article>`).join("");
        document.querySelector("#skills-grid").innerHTML = Object.entries(data.skills).map(([group, skills]) => `
          <div class="skill-group"><h3>${escapeHtml(group.replace(/_/g, " "))}</h3>
            <div class="chips">${skills.map((skill) => `<span class="chip">${escapeHtml(skill)}</span>`).join("")}</div>
          </div>`).join("");
        document.querySelector("#achievement-list").innerHTML = data.achievements.map((item) => {
          const associatedText = [
            item.associated ?? item.associated_with,
            item.description
          ].filter(Boolean).join(" · ");

          return `
            <article class="detail">
              <div class="achievement-main">
                <h3>${item.url ? `<a href="${safeUrl(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.name)}</a>` : escapeHtml(item.name)}</h3>
                ${associatedText ? `<span>${escapeHtml(associatedText)}</span>` : ""}
              </div>
              <div class="achievement-result">
                ${item.result ? `<strong>${escapeHtml(item.result)}</strong>` : ""}
              </div>
            </article>`;
        }).join("");
        site.hidden = false;
      })
      .catch((error) => {
        notice.textContent = `${error.message}. Open this page through a local web server so it can access the JSON file.`;
        notice.hidden = false;
      });
  </script>
</body>

</html>
